name: test and review python code
on: push
jobs:
    job_python:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout the code on runner
              uses: actions/checkout@v7
            - name: set up python
              uses: actions/setup-python@v7
              with:
                    python-version: '3.13'
            - name: install dependencies
              run: |
                  pip install --upgrade pip
                  pip install -r requirements.txt
            - name: run tests
              run: |
                  pytest tests
